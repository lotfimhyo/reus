name: Reus source release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate local-first core
        env:
          REUS_STORAGE_BACKEND: memory
          REUS_EVENT_BUS_BACKEND: memory
        run: bash scripts/run_local_quality.sh
      - name: Build clean source archive
        run: |
          bash scripts/package_release.sh "Reus_core_${{ github.ref_name }}.zip"
          sha256sum "Reus_core_${{ github.ref_name }}.zip" > "Reus_core_${{ github.ref_name }}.zip.sha256"
      - name: Publish source archive and checksum
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Reus_core_${{ github.ref_name }}.zip
            Reus_core_${{ github.ref_name }}.zip.sha256

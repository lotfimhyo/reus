#cloud-config
# Project: Reus | Founder: Lotfi Mahiddine | Organization: Reulink
# Replace the release URL and SHA-256 before use. Keep this file secret-free.
package_update: true
packages: [python3, python3-venv, curl, unzip]
users:
  - name: reus
    system: true
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/reus/first.env
    permissions: '0600'
    owner: reus:reus
    content: |
      REUS_NODE_ROLE=text-node
      REUS_NODE_LABEL=first-cloud
      REUS_MTLS_HOST=127.0.0.1
      REUS_MTLS_PORT=9443
      REUS_BOOTSTRAP_HOST=127.0.0.1
      REUS_BOOTSTRAP_PORT=9444
      REUS_NODE_DATA_DIR=/var/lib/reus/first-cloud
      REUS_NODE_SEED_ARGS=
runcmd:
  - install -d -o reus -g reus /var/lib/reus/first-cloud /etc/reus /opt/reus
  - 'test -n "${REUS_RELEASE_URL:?Set REUS_RELEASE_URL in user-data} "'
  - 'curl -fsSL "$REUS_RELEASE_URL" -o /tmp/reus.zip'
  - 'echo "$REUS_RELEASE_SHA256  /tmp/reus.zip" | sha256sum -c -'
  - unzip -q /tmp/reus.zip -d /opt/reus
  - /opt/reus/scripts/reusctl.sh install
  - install -m 0644 /opt/reus/deploy/systemd/reus-node@.service /etc/systemd/system/
  - systemctl daemon-reload
  - systemctl enable --now reus-node@first
